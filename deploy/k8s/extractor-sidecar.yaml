# Optional extraction sidecar — a strategic-merge patch, not a standalone
# resource.
#
# Applied by default — kustomization.yaml lists it. CI builds and publishes the
# image from deploy/sidecar/wrapper, so it is no longer something you have to
# produce yourself; point the `REPLACE/wishbone-extractor` name at your registry
# in your overlay's `images:` block, as with the app image.
#
# Everything else in this directory deploys a complete, working app without it,
# so removing the `patches` entry is a supported choice: extraction falls back to
# the built-in metadata tiers and the manual form.
#
# Measured worth: on large marketplaces this recovers title, price and image
# where the metadata tiers return only a description, at a cost of roughly two
# seconds per lookup. On sites with real structured data it never runs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wishbone
spec:
  template:
    spec:
      containers:
        - name: wishbone
          env:
            - name: EXTRACTOR_SIDECAR_URL
              value: http://127.0.0.1:8081

        # Listens on loopback only, on purpose: it has no authentication and
        # will fetch any URL handed to it. Do not give it a Service.
        - name: extractor
          image: REPLACE/wishbone-extractor:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: HOST
              value: "127.0.0.1"
            - name: PORT
              value: "8081"
            # The pod securityContext runs every container as 65532, which is
            # not the node image's own user and has no home directory.
            - name: HOME
              value: /tmp
          volumeMounts:
            # Shares the emptyDir the app already mounts; the root filesystem
            # is read-only and node wants somewhere to write.
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
