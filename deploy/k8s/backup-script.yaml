apiVersion: v1
kind: ConfigMap
metadata:
  name: wishd-backup-script
  labels:
    app.kubernetes.io/name: wishd
data:
  backup.sh: |
    #!/bin/sh
    # Backup loop for wishd (plan §10).
    #
    # VACUUM INTO is safe against a live writer. Copying a WAL-mode database
    # file with cp is not: you get the main file without the WAL that makes it
    # consistent.
    #
    # The prune is not optional. A backup job that silently fills the volume is
    # the realistic failure mode here, not an exotic one.
    set -eu

    DB=${DB:-/data/app.db}
    DEST=${DEST:-/backup}
    IMAGES=${IMAGES:-/data/images}
    INTERVAL=${BACKUP_INTERVAL_SECONDS:-86400}
    KEEP=${BACKUP_KEEP:-14}

    apk add --no-cache sqlite tar >/dev/null 2>&1 || true

    log() { echo "[backup] $(date -Iseconds) $*"; }

    while true; do
      stamp=$(date +%F)
      out="$DEST/app-$stamp.db"

      if sqlite3 "$DB" "VACUUM INTO '$out.tmp'"; then
        mv "$out.tmp" "$out"
        log "wrote $out ($(wc -c < "$out") bytes)"
      else
        rm -f "$out.tmp"
        log "ERROR: VACUUM INTO failed"
      fi

      # Images are content-addressed files, so a plain archive is fine.
      if [ -d "$IMAGES" ]; then
        if tar -czf "$DEST/images-$stamp.tar.gz.tmp" -C "$(dirname "$IMAGES")" "$(basename "$IMAGES")"; then
          mv "$DEST/images-$stamp.tar.gz.tmp" "$DEST/images-$stamp.tar.gz"
          log "wrote $DEST/images-$stamp.tar.gz"
        else
          rm -f "$DEST/images-$stamp.tar.gz.tmp"
          log "ERROR: image archive failed"
        fi
      fi

      # Retain the most recent $KEEP of each kind and delete the rest.
      for pattern in "app-*.db" "images-*.tar.gz"; do
        # shellcheck disable=SC2086
        ls -1t $DEST/$pattern 2>/dev/null | tail -n +$((KEEP + 1)) | while read -r old; do
          log "pruning $old"
          rm -f "$old"
        done
      done

      log "sleeping ${INTERVAL}s"
      sleep "$INTERVAL"
    done
