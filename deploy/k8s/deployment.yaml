# wishd deployment.
#
# replicas: 1 and strategy Recreate are load-bearing, not conservatism: the
# volume is RWO and SQLite has exactly one writer. A rolling update would have
# two pods reaching for the same database file.
#
# Every value marked REPLACE is environment-specific.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wishd
  labels:
    app.kubernetes.io/name: wishd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: wishd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wishd
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wishd
          image: REPLACE/wishd:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: WISHD_ADDR
              value: ":8080"
            - name: WISHD_DATA_DIR
              value: /data
            - name: WISHD_BASE_URL
              value: https://REPLACE.example.com
            - name: WISHD_SECURE_COOKIES
              value: "true"
            # Only the ingress controller may set X-Forwarded-For; everything
            # else falls back to the socket address. Set this to the CIDR your
            # ingress pods actually run in — leaving it empty is safe, leaving
            # it wide open is not.
            - name: WISHD_TRUSTED_PROXY_CIDRS
              value: "REPLACE-WITH-INGRESS-POD-CIDR"
            - name: WISHD_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: wishd
                  key: secret-key
            # Only used while the users table is empty; safe to leave set.
            - name: WISHD_BOOTSTRAP_ADMIN
              valueFrom:
                secretKeyRef:
                  name: wishd
                  key: bootstrap-admin
                  optional: true
            - name: WISHD_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wishd
                  key: bootstrap-admin-password
                  optional: true
            # The extraction sidecar is opt-in: apply
            # extractor-sidecar.yaml as a patch to add both the container and
            # this variable. The app is fully functional without it.
          volumeMounts:
            - name: data
              mountPath: /data
            # Multipart uploads spill to os.TempDir() once they exceed the
            # in-memory limit, and the root filesystem is read-only.
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

        # Backup sidecar: the same image, running the backup subcommand.
        #
        # It is the same binary because the image is a static binary on
        # scratch with no shell and no package manager, running as an
        # unprivileged user — a shell script here could not install sqlite3,
        # and would fail silently once a day. The app already links SQLite, so
        # it issues VACUUM INTO itself, which is safe against the live writer
        # in the container next door. A plain copy of a WAL-mode database is
        # not.
        - name: backup
          image: REPLACE/wishd:latest
          imagePullPolicy: IfNotPresent
          args: ["backup"]
          env:
            - name: WISHD_DATA_DIR
              value: /data
            - name: BACKUP_DEST
              value: /backup
            - name: BACKUP_INTERVAL
              value: "24h"
            - name: BACKUP_KEEP
              value: "14"
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
            - name: backup
              mountPath: /backup
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: data
          persistentVolumeClaim:
            claimName: wishd-data
        - name: backup
          persistentVolumeClaim:
            claimName: wishd-backup
