# Example only — do not commit real values. Generate the key with:
#
#   openssl rand -hex 32
#
# Supply the real Secret out of band — sealed, external, or applied by hand.
# This file only documents the keys wishbone reads.
apiVersion: v1
kind: Secret
metadata:
  name: wishbone
  labels:
    app.kubernetes.io/name: wishbone
type: Opaque
stringData:
  # Signs CSRF tokens. If unset, wishbone generates a random key at startup and
  # warns on the admin page; CSRF tokens then stop validating across restarts.
  secret-key: "REPLACE-WITH-64-HEX-CHARACTERS"

  # Used once, only while the users table is empty. Delete after the first
  # admin exists, or leave it — it is ignored from then on.
  bootstrap-admin: "admin"
  bootstrap-admin-password: "REPLACE-WITH-A-LONG-PASSPHRASE"
