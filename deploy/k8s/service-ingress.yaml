apiVersion: v1
kind: Service
metadata:
  name: wishd
  labels:
    app.kubernetes.io/name: wishd
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: wishd
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wishd
  labels:
    app.kubernetes.io/name: wishd
  annotations:
    cert-manager.io/cluster-issuer: REPLACE-CLUSTER-ISSUER
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # HSTS on. Most controllers send this by default once TLS is configured;
    # stated explicitly so it survives a controller-wide config change.
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains";
    # Item pictures are uploaded through the app.
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["REPLACE.example.com"]
      secretName: wishd-tls
  rules:
    - host: REPLACE.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wishd
                port:
                  name: http
