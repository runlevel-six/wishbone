           C17.4 20.8 20.6 18.6 22.6 15 C24.6 11.4 23.8 7.6 20.6 6.6"
        fill="none" stroke="#f7f5f2" stroke-width="3.1"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
