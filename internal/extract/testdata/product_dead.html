<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Best Sellers | Cedar Press</title>
  <!--
    This is the fixture that matters most. A dead product link on a real
    retailer returned HTTP 200 with valid OpenGraph tags describing the parent
    collection page. Every extractor "succeeds" here and produces a
    confidently wrong item unless the soft-404 guard catches it.
  -->
  <link rel="canonical" href="https://cedarpress.example/collections/best-sellers">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Best Sellers">
  <meta property="og:description" content="Our most popular custom book sets.">
  <meta property="og:image" content="https://cdn.cedarpress.example/collections/best-sellers.jpg">
  <meta property="og:url" content="https://cedarpress.example/collections/best-sellers">
</head>
<body>
  <h1>Best Sellers</h1>
</body>
</html>
