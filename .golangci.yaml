---
# yaml-language-server: $schema=https://golangci-lint.run/jsonschema/golangci.jsonschema.json
version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - revive
    - unconvert
    - unparam
    - usestdlibvars

  settings:
    errcheck:
      # Two categories, both deliberate.
      #
      # Writes to a response or to the process's own output: a failed write has
      # nowhere left to report itself — the client is gone or stdout is gone —
      # and checking each one would bury the writes that do matter.
      #
      # Deferred Close and Rollback: the value is discarded on purpose. A failed
      # Close on a file being read tells you nothing you can act on, and the
      # rollback in store.write runs only when the commit did not, on a
      # connection that is closed immediately afterwards.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - io.WriteString
        - io.Copy
        - (*database/sql.Rows).Close
        - (*database/sql.DB).Close
        - (*database/sql.Conn).Close
        - (*database/sql.Tx).Rollback
        - (*os.File).Close
        - (io.Closer).Close
        - (net.Conn).Close
        # An httptest handler's write: there is no error path in a test server,
        # and every one of these would need the same blank assignment.
        - (net/http.ResponseWriter).Write
    revive:
      rules:
        # Deliberately *without* the `exported` rule, which would demand a doc
        # comment on 83 identifiers here. This is an application, not a library:
        # everything but package main lives under internal/, so there is no
        # consumer whose API surface those comments would document. The comments
        # in this tree explain decisions and traps, which is where they earn
        # their keep — a mandate to comment every exported symbol produces
        # "// Config is the config." at scale, and that is noise rather than
        # documentation.
        - name: package-comments
    misspell:
      # American English: the tree is written in it, and flipping the locale
      # would flag the spellings that are already correct here.
      locale: US

  exclusions:
    rules:
      # Table-driven tests get long and repetitive by design, and a test helper
      # taking an argument every case happens to pass identically is still
      # clearer than two helpers.
      - path: _test\.go
        linters: [unparam, gocritic, revive]
      # Generated by templ. Nothing here is hand-written, and reformatting or
      # re-commenting it would be undone by the next `make generate`.
      - path: _templ\.go
        linters: [errcheck, gocritic, revive, unparam, unconvert]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes: [wishbone]

issues:
  max-same-issues: 0
  max-issues-per-linter: 0
